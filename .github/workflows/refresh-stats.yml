name: Refresh stats card

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch:

# Only one refresh at a time; a queued run is pointless once a newer one starts.
concurrency:
  group: refresh-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rewrite the figures in assets/stats.svg
        env:
          # Add a PAT with read:user + repo as the STATS_TOKEN secret to count
          # private repositories and private contributions. Without it the job
          # still runs, but only public activity is visible and the numbers
          # come out lower.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-stats.mjs

      - name: Commit if the numbers moved
        run: |
          if [ -z "$(git status --porcelain assets/stats.svg)" ]; then
            echo "numbers unchanged; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git commit -m "chore: refresh stats card [skip ci]"
          git push
