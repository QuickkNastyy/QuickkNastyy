<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Animated QN hex badge">
  <defs>
    <radialGradient id="abg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#221046"/><stop offset="52%" stop-color="#130726"/><stop offset="100%" stop-color="#07030E"/>
    </radialGradient>
    <linearGradient id="aneon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#C93BC0"/><stop offset="34%" stop-color="#7B3FF2"/>
      <stop offset="68%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#0BD6EE"/>
    </linearGradient>
    <linearGradient id="aring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0BD6EE"/><stop offset="52%" stop-color="#5B8CF7"/><stop offset="100%" stop-color="#9B4FF5"/>
    </linearGradient>
    <filter id="ag1" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="ag2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>

    <g id="aqn" transform="translate(200,200) scale(.3) translate(-520,-506)">
      <path fill-rule="evenodd" d="M290,370 L460,370 L500,410 L500,580 L460,620 L290,620 L250,580 L250,410 Z
                                   M316,438 L434,438 L440,446 L440,544 L434,552 L316,552 L310,544 L310,446 Z"/>
      <path d="M436,514 L541,619 L499,661 L394,556 Z"/>
      <path d="M540,370 L600,370 L730,540 L730,370 L790,370 L790,620 L730,620 L600,450 L600,620 L540,620 Z"/>
    </g>
    <path id="ahex" d="M368,200 L284,55 L116,55 L32,200 L116,345 L284,345 Z"/>
    <clipPath id="aclip"><rect width="400" height="400"/></clipPath>
    <clipPath id="ahexClip"><use href="#ahex"/></clipPath>
  </defs>

  <style>
    .spin{animation:aspin 18s linear infinite;transform-origin:200px 200px}
    @keyframes aspin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .breathe{animation:abreathe 4.5s ease-in-out infinite}
    @keyframes abreathe{0%,100%{opacity:.32}50%{opacity:.72}}
    .sweep{animation:asweep 5.5s cubic-bezier(.5,0,.5,1) infinite}
    @keyframes asweep{0%{transform:translateY(-120px)}55%,100%{transform:translateY(400px)}}
    .flick{animation:aflick 5.5s steps(1) infinite}
    @keyframes aflick{0%,58%{opacity:0}59%{opacity:.5}61%,100%{opacity:0}}
    .flick2{animation:aflick2 5.5s steps(1) infinite}
    @keyframes aflick2{0%,59%{opacity:0}60%{opacity:.45}62%,100%{opacity:0}}
  </style>

  <g clip-path="url(#aclip)">
    <rect width="400" height="400" fill="#07030E"/>
    <rect width="400" height="400" fill="url(#abg)"/>
    <g stroke="#5B8CF7" stroke-width="1" opacity=".08">
      <path d="M0,50 H400 M0,100 H400 M0,150 H400 M0,200 H400 M0,250 H400 M0,300 H400 M0,350 H400"/>
      <path d="M50,0 V400 M100,0 V400 M150,0 V400 M200,0 V400 M250,0 V400 M300,0 V400 M350,0 V400"/>
    </g>

    <!-- breathing halo -->
    <use class="breathe" href="#ahex" fill="none" stroke="#7B3FF2" stroke-width="20" filter="url(#ag1)"/>

    <!-- rotating tick ring -->
    <g class="spin">
      <circle cx="200" cy="200" r="182" fill="none" stroke="#0BD6EE" stroke-width="2.5"
              stroke-dasharray="3 20" opacity=".55"/>
      <circle cx="200" cy="200" r="168" fill="none" stroke="#9B4FF5" stroke-width="1.5"
              stroke-dasharray="34 58" opacity=".45"/>
    </g>

    <!-- plate + frame -->
    <use href="#ahex" fill="#0D0520" opacity=".85"/>
    <use href="#ahex" fill="none" stroke="url(#aring)" stroke-width="7"/>
    <use href="#ahex" fill="none" stroke="#E4DBFF" stroke-width="1.4" opacity=".75"/>
    <g stroke="#0BD6EE" stroke-width="3" opacity=".85" stroke-linecap="square">
      <path d="M284,55 V38 M116,55 V38 M284,345 V362 M116,345 V362"/>
    </g>

    <!-- monogram -->
    <use href="#aqn" fill="#7B3FF2" opacity=".8" filter="url(#ag1)"/>
    <g class="flick"  transform="translate(-4,2)"><use href="#aqn" fill="#0BD6EE"/></g>
    <g class="flick2" transform="translate(4,-2)"><use href="#aqn" fill="#C93BC0"/></g>
    <use href="#aqn" fill="url(#aneon)"/>
    <use href="#aqn" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity=".35" filter="url(#ag2)"/>

    <!-- scan sweep, confined to the hex -->
    <g clip-path="url(#ahexClip)">
      <g class="sweep">
        <rect x="0" y="0" width="400" height="46" fill="#0BD6EE" opacity=".10"/>
        <rect x="0" y="44" width="400" height="2.5" fill="#B9F2FA" opacity=".55"/>
      </g>
    </g>
  </g>
</svg>
