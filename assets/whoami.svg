<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Terminal: whoami --verbose, printing handle, role, projects and stack">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9B4FF5"/>
      <stop offset="50%" stop-color="#4B6EF5"/>
      <stop offset="100%" stop-color="#0BD6EE"/>
    </linearGradient>
    <clipPath id="typeClip"><rect class="wipe" x="42" y="52" width="152" height="26"/></clipPath>
  </defs>

  <style>
    .mn{font-family:ui-monospace,"SFMono-Regular","Consolas","Liberation Mono",monospace}
    .wipe{transform:scaleX(0);transform-origin:left center;transform-box:fill-box;
          animation:type 9.5s steps(16) infinite}
    @keyframes type{0%{transform:scaleX(0)}13%,95%{transform:scaleX(1)}100%{transform:scaleX(0)}}
    .caret{animation:blink 1.1s steps(2) infinite}
    @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
    .row{opacity:0;animation:show 9.5s linear infinite}
    @keyframes show{0%,14%{opacity:0}19%,94%{opacity:1}100%{opacity:0}}
    .dot{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  </style>

  <rect width="900" height="260" rx="8" fill="#0B0416"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="8" fill="none" stroke="#2A1247" stroke-width="1"/>

  <!-- title bar -->
  <rect x="1" y="1" width="898" height="34" rx="7" fill="#150826"/>
  <circle cx="24" cy="18" r="5" fill="#E0399B"/>
  <circle cx="42" cy="18" r="5" fill="#7B3FF2"/>
  <circle cx="60" cy="18" r="5" fill="#0BD6EE"/>
  <text class="mn" x="80" y="23" font-size="12" fill="#7A5FA8">quickknastyy@github — zsh — 96×24</text>
  <rect x="1" y="34" width="898" height="1.5" fill="url(#bar)" opacity=".75"/>

  <!-- typed command -->
  <text class="mn" x="22" y="71" font-size="15" fill="#0BD6EE">$</text>
  <g clip-path="url(#typeClip)">
    <text class="mn" x="42" y="71" font-size="15" fill="#F2E9FF">whoami --verbose</text>
  </g>
  <rect class="caret" x="196" y="57" width="9" height="17" fill="#0BD6EE"/>

  <!-- output -->
  <g class="mn" font-size="14">
    <g class="row">
      <text x="42" y="106" fill="#6F5A94">handle  </text>
      <text x="140" y="106" fill="#E85BB0" font-weight="600">quickknastyy</text>
    </g>
    <g class="row">
      <text x="42" y="132" fill="#6F5A94">role    </text>
      <text x="140" y="132" fill="#BDB4F7">systems builder · automation addict · workflow architect</text>
    </g>
    <g class="row">
      <text x="42" y="158" fill="#6F5A94">forging </text>
      <text x="140" y="158" fill="#0BD6EE">thinkforge<tspan fill="#4E3D6E"> · </tspan>echoforge<tspan fill="#4E3D6E"> · </tspan>leadforge<tspan fill="#4E3D6E"> · </tspan>jobbot<tspan fill="#4E3D6E"> · </tspan>dsh</text>
    </g>
    <g class="row">
      <text x="42" y="184" fill="#6F5A94">stack   </text>
      <text x="140" y="184" fill="#BDB4F7">typescript · electron · playwright · node · python · react</text>
    </g>
    <g class="row">
      <text x="42" y="210" fill="#6F5A94">reach   </text>
      <text x="140" y="210" fill="#BDB4F7">linkedin · gmail · discord</text>
    </g>
    <g class="row">
      <text x="42" y="238" fill="#6F5A94">status  </text>
      <circle class="dot" cx="146" cy="233" r="4.5" fill="#0BD6EE"/>
      <text x="160" y="238" fill="#F2E9FF">shipping</text>
    </g>
  </g>
</svg>
